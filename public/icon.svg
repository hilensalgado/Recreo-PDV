<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />
  
  <!-- Cash Register / Terminal Body -->
  <g transform="translate(96, 86)">
    <!-- Screen base -->
    <rect x="20" y="30" width="280" height="170" rx="18" fill="#0f172a" stroke="#ffffff" stroke-width="6" />
    <!-- Screen content -->
    <rect x="36" y="46" width="248" height="138" rx="10" fill="#1e293b" />
    
    <!-- Screen text lines -->
    <rect x="52" y="66" width="90" height="14" rx="4" fill="#38bdf8" />
    <rect x="52" y="90" width="130" height="10" rx="3" fill="#94a3b8" />
    <rect x="52" y="108" width="100" height="10" rx="3" fill="#94a3b8" />
    <!-- Price total badge on screen -->
    <rect x="180" y="130" width="90" height="38" rx="8" fill="url(#accent)" />
    <text x="225" y="156" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="22" text-anchor="middle">$99.00</text>
    
    <!-- Stand -->
    <path d="M125,200 L195,200 L210,240 L110,240 Z" fill="#334155" />
    
    <!-- Register Base & Drawer -->
    <rect x="0" y="235" width="320" height="105" rx="16" fill="#0f172a" stroke="#ffffff" stroke-width="6" />
    <!-- Drawer slot -->
    <rect x="25" y="260" width="270" height="32" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
    <circle cx="160" cy="276" r="6" fill="#38bdf8" />
    <!-- Keypad buttons on top base -->
    <rect x="25" y="302" width="40" height="20" rx="4" fill="#334155" />
    <rect x="75" y="302" width="40" height="20" rx="4" fill="#334155" />
    <rect x="125" y="302" width="40" height="20" rx="4" fill="#334155" />
    <rect x="175" y="302" width="40" height="20" rx="4" fill="#334155" />
    <rect x="225" y="302" width="70" height="20" rx="4" fill="url(#accent)" />
  </g>
</svg>
